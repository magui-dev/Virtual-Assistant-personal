<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Virtual Desk Assistant - Hiyori</title>

  <!-- 마크다운 파서 (marked.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- CSS 파일 링크 (순서 중요: live2d가 먼저, 패널들이 나중) -->
  <link rel="stylesheet" href="frontend/styles/live2d.css" />
  <link rel="stylesheet" href="frontend/styles/chat.css" />
  <!-- <link rel="stylesheet" href="frontend/styles/tasks.css" /> -->

   <!-- 기본 스타일 (배경 완전 투명) -->
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        /* pointer-events는 각 요소별로 CSS에서 제어 */
      }
      #user-display {
        position: absolute;
        top: 10px;
        right: 12px;
        padding: 6px 10px;
        background: rgba(0,0,0,0.55);
        color: #fff;
        border-radius: 8px;
        font-size: 12px;
        z-index: 2000;
        pointer-events: none;
      }
      /* 나머지 스타일은 별도 CSS 파일로 분리됨 */

</head>

<body>
  <!-- 모듈 스크립트: 먼저 로드 (전역으로 export) -->
  <script type="module" src="frontend/chat/chatUI.js"></script>

  <!-- Live2D 스테이지 (배경, 전체 화면) -->
  <div id="stage"></div>
  <div id="user-display">Not logged in</div>
  
  <!-- 채팅 패널 (고정 위치, 최상위) -->
  <div id="chat-panel">
    <h2>💬 AI 비서</h2>
    <div id="messages"></div>
    
    <!-- 사용 가이드 -->
    <div class="usage-guide">
      <div class="guide-header" onclick="toggleGuide()">
        <span class="guide-title">💡 사용법 예시</span>
        <span class="toggle-btn" id="toggleBtn">
          <span class="toggle-text" id="toggleText">펼치기</span>
          <span class="toggle-icon collapsed" id="toggleIcon">▼</span>
        </span>
      </div>
      
      <div class="guide-content collapsed" id="guideContent">
        <div class="guide-item">
          <span class="guide-label">📊 보고서:</span>
          <span class="guide-example" data-text="일일보고서 작성할래">"일일보고서 작성할래"</span>
        </div>
        <div class="guide-item">
          <span class="guide-label">🧠 브레인스토밍:</span>
          <span class="guide-example" data-text="아이디어를 만들어줘">"아이디어를 만들어줘"</span>
        </div>
        <div class="guide-item">
          <span class="guide-label">👥 HR 정보:</span>
          <span class="guide-example" data-text="우리 회사 승진 프로세스 알려줘">"우리 회사 승진 프로세스 알려줘"</span>
        </div>
        <div class="guide-item">
          <span class="guide-label">📋 보험 매뉴얼:</span>
          <span class="guide-example" data-text="보험 약관이 해당되지 않는 경우 설명해줘">"보험 약관이 해당되지 않는 경우 설명해줘"</span>
        </div>
        <div class="guide-item">
          <span class="guide-label">💬 상담:</span>
          <span class="guide-example" data-text="그냥 고민 털어놓기">"그냥 고민 털어놓기"</span>
        </div>
      </div>
    </div>
    
    <div id="input-area">
      <input 
        type="text" 
        id="chat-input" 
        placeholder="메시지를 입력하세요..." 
        autocomplete="off"
      />
      <button id="send-btn">전송</button>
    </div>
  </div>

  <script>
    /****************************************************************
     * Electron ipcRenderer 준비
     * - 브라우저로 열었을 때는 require가 없으니 try/catch
     ****************************************************************/
    let ipcRenderer = null;
    try {
      // electron 환경
      ipcRenderer = require('electron').ipcRenderer;
    } catch (e) {
      console.warn('Electron 환경이 아니어서 ipcRenderer 없음:', e);
    }

    /****************************************************************
     * 사용 가이드 접기/펼치기 함수
     ****************************************************************/
    function toggleGuide() {
      const content = document.getElementById('guideContent');
      const icon = document.getElementById('toggleIcon');
      const text = document.getElementById('toggleText');
      
      if (!content || !icon || !text) return;
      
      const isCollapsed = content.classList.toggle('collapsed');
      icon.classList.toggle('collapsed');
      
      // 텍스트 변경
      text.textContent = isCollapsed ? '펼치기' : '접기';
      
      // 상태를 localStorage에 저장
      localStorage.setItem('guideCollapsed', isCollapsed);
    }
    
    // 페이지 로드 시 이전 상태 복원 (기본값: 접힌 상태)
    window.addEventListener('DOMContentLoaded', () => {
      // localStorage에 저장된 값이 있으면 복원, 없으면 기본 접힌 상태 유지
      const savedState = localStorage.getItem('guideCollapsed');
      
      // savedState가 'false'인 경우에만 펼침 (명시적으로 펼친 적이 있는 경우)
      if (savedState === 'false') {
        const content = document.getElementById('guideContent');
        const icon = document.getElementById('toggleIcon');
        const text = document.getElementById('toggleText');
        
        if (content && icon && text) {
          content.classList.remove('collapsed');
          icon.classList.remove('collapsed');
          text.textContent = '접기';
        }
      }
      
      // 예시 클릭 시 자동 입력
      document.querySelectorAll('.guide-example').forEach(example => {
        example.addEventListener('click', function() {
          const text = this.getAttribute('data-text');
          const chatInput = document.getElementById('chat-input');
          if (chatInput && text) {
            chatInput.value = text;
            chatInput.focus();
          }
        });
      });
    });

    /****************************************************************
     * Activity Monitor (인라인)
     ****************************************************************/
    let activityMonitorCleanup = null;
    
    // Activity Monitor 설정
    const ACTIVITY_CONFIG = {
      dev: {
        idleThresholdMs: 3 * 1000,        // 3초 (테스트용)
        longActiveThresholdMs: 10 * 1000, // 10초 (테스트용)
        checkIntervalMs: 1000,
      },
      prod: {
        idleThresholdMs: 10 * 60 * 1000,      // 10분
        longActiveThresholdMs: 50 * 60 * 1000, // 50분 (5분 이하 휴식 허용)
        checkIntervalMs: 5000,                   // 5초마다 체크
      }
    };
    
    function setupActivityMonitor(options) {
      const { mode, onIdle, onLongActive } = options;
      const config = ACTIVITY_CONFIG[mode];
      
      // Activity Monitor 시작 (로그 제거)
      
      let lastInputAt = Date.now();
      let sessionStartAt = Date.now();
      let isIdle = false;
      let hasNotifiedLongActive = false;
      let checkTimer = null;
      
      function handleUserInput() {
        const now = Date.now();
        lastInputAt = now;
        
        if (isIdle) {
          // 활동 재개
          isIdle = false;
          sessionStartAt = now;
          hasNotifiedLongActive = false;
        }
      }
      
      function checkActivity() {
        const now = Date.now();
        const timeSinceLastInput = now - lastInputAt;
        const currentSessionDuration = now - sessionStartAt;
        
        // Idle 체크
        if (!isIdle && timeSinceLastInput >= config.idleThresholdMs) {
          isIdle = true;
          // Idle 상태 진입
          
          try {
            onIdle();
          } catch (error) {
            console.error('❌ onIdle 콜백 오류:', error);
          }
          
          sessionStartAt = now;
          hasNotifiedLongActive = false;
          return;
        }
        
        // 장시간 활동 체크
        if (!isIdle && !hasNotifiedLongActive) {
          if (currentSessionDuration >= config.longActiveThresholdMs) {
            hasNotifiedLongActive = true;
            // 장시간 활동 감지
            
            try {
              onLongActive();
            } catch (error) {
              console.error('❌ onLongActive 콜백 오류:', error);
            }
          }
        }
        
        // 디버깅 로그
        if (mode === 'dev' && !isIdle && !hasNotifiedLongActive) {
          const remaining = (config.longActiveThresholdMs - currentSessionDuration) / 1000;
          if (remaining > 0 && Math.floor(remaining) % 2 === 0) {
            // 장시간 활동 카운트다운 (로그 제거)
          }
        }
      }
      
      // 이벤트 리스너 등록
      const events = ['mousemove', 'mousedown', 'wheel', 'keydown'];
      events.forEach(eventType => {
        window.addEventListener(eventType, handleUserInput, { passive: true });
      });
      
      // 입력 이벤트 리스너 등록
      
      // 타이머 시작
      checkTimer = setInterval(checkActivity, config.checkIntervalMs);
      // 주기적 체크 시작
      
      // Cleanup 함수 반환
      return function cleanup() {
        // Activity Monitor 정리
        events.forEach(eventType => {
          window.removeEventListener(eventType, handleUserInput);
        });
        if (checkTimer) {
          clearInterval(checkTimer);
        }
      };
    }
    
    function setupActivityMonitorWithMotions() {
      const mode = 'prod'; // 배포 모드: Idle 10분, 장시간 활동 50분
      
      activityMonitorCleanup = setupActivityMonitor({
        mode: mode,
        
        onIdle: () => {
          // Idle 콜백: 캐릭터 모션
          if (model) {
            model.motion('Idle');
          }
          
          // 채팅창에 메시지 (모듈 로드되었을 때만)
          if (typeof window.addMessage === 'function') {
            window.addMessage('assistant', '조금 쉬고 계신가요? 😊');
          } else {
            // 메시지 출력 (모듈 미로드 시)
          }
        },
        
        onLongActive: () => {
          // 장시간 활동 콜백: 캐릭터 모션
          if (model) {
            model.motion('Tap@Body');
          }
          
          // 채팅창에 메시지 (모듈 로드되었을 때만)
          if (typeof window.addMessage === 'function') {
            window.addMessage('assistant', '오래 일하셨네요! 잠깐 일어나서 스트레칭 어때요? 🤸‍♀️');
          } else {
            // 메시지 출력 (모듈 미로드 시)
          }
        }
      });
    }

    /****************************************************************
     * 채팅 및 브레인스토밍 초기화 (모듈에서 처리)
     * - frontend/chat/chatUI.js
     * - frontend/brainstorming/brainstormingService.js
     * 
     * ⚠️ 중복 로직 제거됨 - 모든 채팅 로직은 chatUI.js에서 처리
     ****************************************************************/

    /****************************************************************
     * 순차 로더
     * - 의존성 → 코어 → 플러그인 순서 보장
     * - CDN 실패 시 다음 후보 자동 시도
     ****************************************************************/
    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url;
        s.async = false;               // 로드 순서 보장(중요)
        s.onload = () => resolve();
        s.onerror = () => { console.error('❌ 로드 실패:', url); reject(new Error(url)); };
        document.head.appendChild(s);
      });
    }

    // 전역에서 쓸 참조용 (스케일 조절을 위해)
    let app = null;
    let model = null;

    async function init() {
      try {
        /******** 1) Pixi.js (v6.x) : 플러그인 0.4.x와 호환 ********/
        const pixiCdn = [
          'https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js',
          'https://unpkg.com/pixi.js@6.5.10/dist/browser/pixi.min.js'
        ];
        let ok = false;
        for (const url of pixiCdn) {
          try { await loadScript(url); ok = true; break; } catch {}
        }
        if (!ok) throw new Error('Pixi.js 로드 실패');
        // PixiJS 로드 완료

        /******** 2) Live2D Cubism Core : 플러그인이 참조하는 런타임 ********/
        const coreCdn = [
          'https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js',
          'https://cubism.live2d.com/sdk-web/bin/live2dcubismcore.min.js'
        ];
        ok = false;
        for (const url of coreCdn) {
          try { await loadScript(url); ok = true; break; } catch {}
        }
        if (!ok) throw new Error('Live2D Cubism Core 로드 실패');
        // Live2DCubismCore 로드 완료

        /******** 3) pixi-live2d-display (Cubism4 빌드, 0.4.x) ********/
        const pluginCdn = [
          'https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.js',
          'https://unpkg.com/pixi-live2d-display@0.4.0/dist/cubism4.js',
          'https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display@v0.4.0/dist/cubism4.js'
        ];
        ok = false;
        for (const url of pluginCdn) {
          try {
            await loadScript(url);
            if (window.PIXI?.live2d?.Live2DModel) { ok = true; break; }
          } catch {}
        }
        if (!ok) throw new Error('pixi-live2d-display (cubism4) 로드 실패');

        // Live2D 플러그인 로드 완료

        /******** 4) Pixi 앱 & Live2D 모델 로드 ********/
        // 전체 윈도우 크기로 앱 생성
        app = new PIXI.Application({ 
          backgroundAlpha: 0,
          width: window.innerWidth,
          height: window.innerHeight,
          resizeTo: window
        });
        
        // stage에 canvas 추가
        const stageContainer = document.getElementById('stage');
        stageContainer.appendChild(app.view);

        const MODEL_URL = 'public/models/hiyori_free_ko/runtime/hiyori_free_t08.model3.json';
        // Stage를 interactive로 설정
        app.stage.interactive = true;
        app.stage.hitArea = app.screen;

        model = await PIXI.live2d.Live2DModel.from(MODEL_URL);

         // 배치: 화면 중앙 하단 (듀얼 모니터 대응)
         model.anchor.set(0.5, 1);
         model.scale.set(0.18); // 초기 크기 (머리 안 잘리도록 축소)
         
         // 위치 설정 (화면 중앙 기준, 캔버스 크기 기준)
         const updateModelPosition = () => {
           // 캔버스의 너비를 기준으로 중앙 조금 오른쪽
           const canvasWidth = app.screen.width;
           const canvasHeight = app.screen.height;
           model.position.set(canvasWidth * 0.75, canvasHeight - 50);
           // 캐릭터 위치 설정 완료
         };
         updateModelPosition();
         
         // 윈도우 리사이즈 시 위치 업데이트
         window.addEventListener('resize', () => {
           updateModelPosition();
         });
         
         app.stage.addChild(model);
         // 캐릭터 화면에 추가 완료

         // Document 레벨 드래그 구현
         let isDraggingCharacter = false;
         let dragStartMousePos = null;
         let dragStartModelPos = null;
         
         // 캐릭터 바운딩 박스 체크 함수
         const isMouseOverCharacter = (mouseX, mouseY) => {
           const bounds = model.getBounds();
           const actualWidth = bounds.width * 0.4; // 좌우 축소
           const widthOffset = (bounds.width - actualWidth) / 2;
           const verticalMargin = bounds.height * 0.05;
           
           return mouseX >= bounds.x + widthOffset && 
                  mouseX <= bounds.x + widthOffset + actualWidth &&
                  mouseY >= bounds.y - verticalMargin && 
                  mouseY <= bounds.y + bounds.height + verticalMargin;
         };
         
        // 패널 위에 있는지 체크
        const isMouseOverPanel = (clientX, clientY) => {
          const chatPanel = document.getElementById('chat-panel');
          const bsPanel = document.getElementById('brainstorming-panel');
          const modal = document.querySelector('.custom-task-modal'); // 🔥 모달 추가
          
          // 🔥 모달 체크 (최우선순위)
          if (modal) {
            const rect = modal.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right && 
                clientY >= rect.top && clientY <= rect.bottom) {
              return true;
            }
          }
          
          if (chatPanel && chatPanel.style.display !== 'none') {
            const rect = chatPanel.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right && 
                clientY >= rect.top && clientY <= rect.bottom) {
              return true;
            }
          }
          
          if (bsPanel && bsPanel.style.display !== 'none') {
            const rect = bsPanel.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right && 
                clientY >= rect.top && clientY <= rect.bottom) {
              return true;
            }
          }
          
          return false;
        };
         
         // Document 레벨 이벤트로 드래그 구현
         document.addEventListener('mousedown', (e) => {
           // 패널 위에서는 드래그 시작하지 않음
           if (isMouseOverPanel(e.clientX, e.clientY)) {
             return;
           }
           
           if (isMouseOverCharacter(e.clientX, e.clientY)) {
             // 드래그 시작
             isDraggingCharacter = true;
             dragStartMousePos = { x: e.clientX, y: e.clientY };
             dragStartModelPos = { x: model.position.x, y: model.position.y };
             e.preventDefault();
           }
         });
         
         document.addEventListener('mousemove', (e) => {
           if (isDraggingCharacter && dragStartMousePos) {
             const dx = e.clientX - dragStartMousePos.x;
             const dy = e.clientY - dragStartMousePos.y;
             
             model.position.x = dragStartModelPos.x + dx;
             model.position.y = dragStartModelPos.y + dy;
             
             // 드래그 중
           }
         });
         
         document.addEventListener('mouseup', (e) => {
           if (isDraggingCharacter) {
             const movedDistance = Math.sqrt(
               Math.pow(e.clientX - dragStartMousePos.x, 2) + 
               Math.pow(e.clientY - dragStartMousePos.y, 2)
             );
             
             // 5px 이하면 클릭으로 간주 → 탭 모션
             if (movedDistance < 5) {
               model.motion?.('Tap');
             }
             
             isDraggingCharacter = false;
             dragStartMousePos = null;
             dragStartModelPos = null;
           }
         });

        // 초기화 완료

        // 모델 준비된 후 인터랙션 제어 로직 세팅
        setupInteractionControls();
        
        // 채팅/보고서 패널 초기화 (모듈 로드 대기)
        const initPanels = async () => {
          // 모듈이 로드될 때까지 최대 5초 대기
          let retries = 50;
          while (retries > 0) {
            if (typeof window.initChatPanel === 'function' && 
                typeof window.initReportPanel === 'function') {
              break;
            }
            await new Promise(resolve => setTimeout(resolve, 100));
            retries--;
          }
          
          try {
            if (typeof window.initChatPanel === 'function') {
              window.initChatPanel();
              console.log('✅ 채팅 패널 초기화 완료');
            } else {
              console.error('❌ initChatPanel 함수를 찾을 수 없습니다.');
              // 임시: 채팅 토글 단축키 직접 등록
              const chatPanel = document.getElementById('chat-panel');
              if (chatPanel) {
                let isPanelVisible = true;
                window.addEventListener('keydown', (e) => {
                  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                    isPanelVisible = !isPanelVisible;
                    chatPanel.style.display = isPanelVisible ? 'flex' : 'none';
                  }
                });
              }
            }
          } catch (error) {
            console.error('❌ 채팅 패널 초기화 실패:', error);
          }
          
        };
        
        initPanels();
        
        // Activity Monitor 초기화
        setupActivityMonitorWithMotions();

      } catch (err) {
        console.error('❌ 초기화 실패:', err);
        document.getElementById('app').innerHTML =
          `<div style="color:white;padding:20px;font-family:monospace;">
            <h2>❌ 로드 실패</h2>
            <p>${err.message}</p>
            <p>DevTools → Network/Console 확인</p>
          </div>`;
      }
    }

    /****************************************************************
     * 인터랙션 제어
     * - 캐릭터 드래그: 캐릭터 위치 이동
     * - +/- 키: 크기 조절
     * - 캐릭터 바운딩 박스만 클릭 가능 (동적 조절)
     * - 채팅 패널은 별도 처리
     ****************************************************************/
    function setupInteractionControls() {
      // setupInteractionControls 초기화
      
      let isDragging = false;
      let lastClientX = 0;
      let lastClientY = 0;

      // 크기 조절 함수
      const adjustScale = (delta) => {
        if (!model) return;
        const step = 0.05;
        let newScale = model.scale.x + delta * step;
        newScale = Math.max(0.1, Math.min(1.0, newScale));
        model.scale.set(newScale);
        // 크기 조절
      };

      // 키보드로 크기 조절 및 종료: +/- 키, ESC 키
      // 주의: Cmd/Ctrl + Enter는 채팅 패널에서 처리
      window.addEventListener('keydown', (e) => {
        // 입력창에 포커스가 있을 때는 크기 조절 비활성화
        const chatInput = document.getElementById('chat-input');
        const bsInput = document.getElementById('bs-input');
        if (document.activeElement === chatInput || document.activeElement === bsInput) {
          // 입력창에 포커스가 있으면 ESC만 처리
          if (e.key === 'Escape') {
            e.preventDefault();
            if (ipcRenderer) {
              ipcRenderer.send('va:request-quit');
            }
          }
          return;
        }
        
        if (e.key === '+' || e.key === '=') {
          e.preventDefault();
          adjustScale(1);
        } else if (e.key === '-' || e.key === '_') {
          e.preventDefault();
          adjustScale(-1);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          // ESC 키 - 앱 종료
          if (ipcRenderer) {
            ipcRenderer.send('va:request-quit');
          }
        }
      });

      // 캐릭터 드래그는 Document 레벨 이벤트로 처리

      // 마우스 이벤트 처리: 채팅 패널 vs 캐릭터
      if (ipcRenderer && model) {
        let isOverCharacter = false;
        let isOverChatPanel = false;
        let isOverBsPanel = false;
        let isOverModal = false; // 🔥 모달 상태 변수 추가
        
        const checkIfOverCharacter = (clientX, clientY) => {
          if (!model) return false;
          
          // 캐릭터의 실제 바운딩 박스 가져오기
          const bounds = model.getBounds();
          
          // Live2D 바운딩 박스가 실제보다 넓으므로 좌우를 대폭 축소
          const actualWidth = bounds.width * 0.4;
          const widthOffset = (bounds.width - actualWidth) / 2;
          const verticalMargin = bounds.height * 0.05;
          
          return clientX >= bounds.x + widthOffset && 
                 clientX <= bounds.x + widthOffset + actualWidth &&
                 clientY >= bounds.y - verticalMargin && 
                 clientY <= bounds.y + bounds.height + verticalMargin;
        };
        
        const checkIfOverChatPanel = (clientX, clientY) => {
          const chatPanel = document.getElementById('chat-panel');
          if (!chatPanel || chatPanel.style.display === 'none') return false;
          
          const rect = chatPanel.getBoundingClientRect();
          return clientX >= rect.left && 
                 clientX <= rect.right && 
                 clientY >= rect.top && 
                 clientY <= rect.bottom;
        };
        
        // 브레인스토밍 패널 체크 함수
        const checkIfOverBsPanel = (clientX, clientY) => {
          const bsPanel = document.getElementById('brainstorming-panel');
          if (!bsPanel || bsPanel.style.display === 'none') return false;
          
          const rect = bsPanel.getBoundingClientRect();
          return clientX >= rect.left && 
                 clientX <= rect.right && 
                 clientY >= rect.top && 
                 clientY <= rect.bottom;
        };
        
        
        // 🔥 모달 체크 함수 추가 (동적으로 생성되는 요소)
        const checkIfOverModal = (clientX, clientY) => {
          const modal = document.querySelector('.custom-task-modal');
          if (!modal) return false;
          
          const rect = modal.getBoundingClientRect();
          return clientX >= rect.left && 
                 clientX <= rect.right && 
                 clientY >= rect.top && 
                 clientY <= rect.bottom;
        };
        
        // 초기 상태 설정 함수
        const updateMouseState = (clientX, clientY) => {
          const wasOverChat = isOverChatPanel;
          const wasOverChar = isOverCharacter;
          const wasOverBs = isOverBsPanel;
          const wasOverModal = isOverModal; // 🔥 추가
          
          // 🔥 모달 체크 (최우선순위 - 가장 위에 표시됨)
          isOverModal = checkIfOverModal(clientX, clientY);
          
          // 채팅 패널 체크 (우선순위 높음)
          isOverChatPanel = checkIfOverChatPanel(clientX, clientY);
          
          // 브레인스토밍 패널 체크 (우선순위 높음)
          isOverBsPanel = checkIfOverBsPanel(clientX, clientY);
          
          // 캐릭터 체크 (패널들과 모달이 아닐 때만)
          if (!isOverChatPanel && !isOverBsPanel && !isOverModal) {
            isOverCharacter = checkIfOverCharacter(clientX, clientY);
          } else {
            isOverCharacter = false;
          }
          
          // 상태 변경 시 IPC 전송
          if (wasOverChat !== isOverChatPanel || wasOverChar !== isOverCharacter || wasOverBs !== isOverBsPanel || wasOverModal !== isOverModal) {
            const shouldAcceptClicks = isOverChatPanel || isOverBsPanel || isOverCharacter || isOverModal; // 🔥 모달 추가
            const ignoreValue = !shouldAcceptClicks;
            ipcRenderer.send('va:set-ignore-mouse', ignoreValue);
          }
        };
        
        // 마우스 이동 이벤트
        document.addEventListener('mousemove', (e) => {
          updateMouseState(e.clientX, e.clientY);
        });
        
        // 마우스다운 이벤트 (클릭 감지용)
        document.addEventListener('mousedown', (e) => {
          updateMouseState(e.clientX, e.clientY);
        });
        
        // 마우스업 이벤트 (클릭 종료 감지용)
        document.addEventListener('mouseup', (e) => {
          updateMouseState(e.clientX, e.clientY);
        });
        
        // 초기 상태 설정 (현재 마우스 위치 확인)
        // 약간의 지연을 두어 DOM이 완전히 로드된 후 실행
        setTimeout(() => {
          // 초기에는 마우스 이벤트를 받을 수 있도록 설정
          // (마우스가 이동하면 자동으로 상태가 업데이트됨)
          if (ipcRenderer) {
            ipcRenderer.send('va:set-ignore-mouse', false);
          }
        }, 1000);
      }
    }

    // 모듈 로딩을 기다리기 위해 onload 사용
    window.addEventListener('load', init);
  </script>
</body>
</html>
